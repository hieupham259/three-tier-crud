apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: three-tier
  namespace: three-tier
spec:
  ingressClassName: traefik
  rules:
    - host: crud.hieupn.site
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80