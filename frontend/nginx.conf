# Installed as /etc/nginx/conf.d/default.conf inside nginxinc/nginx-unprivileged.
# The base image runs as uid 101, listens on 8080 and already keeps nginx.pid and the *_temp_path
# directories under /tmp; this file only defines the server block.
server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    server_tokens     off;
    absolute_redirect off;

    # Read-only root filesystem: every temp file must live under /tmp (the only writable mount).
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    client_max_body_size  64k;

    gzip            on;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/javascript application/json image/svg+xml;

    # Kubernetes readiness/liveness probe target: no disk access, no upstream.
    location = /healthz {
        access_log   off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Reverse proxy to the backend Service. The /api prefix is preserved unchanged.
    location /api/ {
        proxy_pass         http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   X-Forwarded-Port  $server_port;
        proxy_set_header   Connection        "";
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # Vite emits content-hashed files under /assets: safe to cache for a long time.
    location /assets/ {
        try_files  $uri =404;
        expires    1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # SPA fallback: unknown paths return index.html so client-side routing works.
    location / {
        try_files  $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }
}
