[project]
name = "three-tier-crud-backend"
version = "0.1.0"
description = "FastAPI + official PyMongo Async API CRUD backend for the three-tier-crud homelab app"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn==0.52.4",
  "pymongo==4.18.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "httpx==0.28.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
